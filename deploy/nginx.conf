# Docker service addresses can change when only a backend is recreated.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream gateway_api {
    zone gateway_api 64k;
    server api:8090 resolve;
}

upstream gateway_mcp {
    zone gateway_mcp 64k;
    server gateway:8091 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # The host terminates HTTPS; canonical directory redirects keep that origin.
    absolute_redirect off;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    location = /healthz { access_log off; return 200 'ok'; }
    location /internal/ { return 404; }
    location /api/ {
        proxy_pass http://gateway_api;
        proxy_set_header Host $host;
        proxy_read_timeout 140s;
    }
    location = /mcp {
        proxy_pass http://gateway_mcp/mcp;
        proxy_set_header Host $host;
        proxy_read_timeout 140s;
        proxy_buffering off;
    }
    location = /console { return 308 /console/$is_args$args; }
    location /console/ { try_files $uri $uri/ /console/index.html; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
