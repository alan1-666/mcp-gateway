server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ {
        proxy_pass http://api:8090;
        proxy_set_header Host $host;
        proxy_read_timeout 140s;
    }
    location = /mcp {
        proxy_pass http://gateway:8091/mcp;
        proxy_set_header Host $host;
        proxy_read_timeout 140s;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
