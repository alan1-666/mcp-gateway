          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/tools/{id}/candidates/{candidate}/publish:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    - $ref: '#/components/parameters/CandidateID'
    post:
      operationId: publishToolCandidate
      tags:
      - Tools
      summary: Publish a candidate as a new active version
      description: Requires admin in the authenticated workspace. Requires expected_version to match the candidate
        base and current tool. Revalidates the live target, locks the tool and candidate, publishes version+1 and
        enables the tool. Concurrent changes return 409. Retrying a published candidate can return the current tool
        only while its published version is still current and live validation passes. Existing prepared/approved operations
        retain their complete prior definition; current access, server disablement and snapshot contract checks still
        apply.
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedVersionInput'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/tools/{id}/retire:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: retireTool
      tags:
      - Tools
      summary: Retire a tool and prevent new dispatch
      description: Requires admin in the authenticated workspace. Checks expected_version, increments version and
        sets status retired/enabled false. Retired tools cannot be restored with ordinary publish/enable; create and
        publish a newly reviewed candidate. Existing operation history is retained.
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedVersionInput'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/audit:
    get:
      operationId: listAuditEvents
      tags:
      - Audit
      summary: Search workspace audit history
      description: 'Requires admin in the authenticated workspace. Keyset order is immutable created_at DESC, id DESC.
        The first request supplies a creation-time upper bound retained in later cursors. total counts current authorized
        matches inside that boundary before the position cursor; live status and permissions can change it. Pages
        are not a frozen database snapshot. Unknown/repeated query fields are rejected. '
      x-required-roles:
      - admin
      parameters:
      - $ref: '#/components/parameters/HistoryLimit'
      - $ref: '#/components/parameters/HistoryCursor'
      - $ref: '#/components/parameters/HistoryActor'
      - $ref: '#/components/parameters/HistoryFrom'
      - $ref: '#/components/parameters/HistoryTo'
      - name: action
        in: query
        required: false
        description: Exact action.
        schema:
          type: string
          maxLength: 128
          x-max-utf8-bytes: 128
      - name: resource_id
        in: query
        required: false
        description: Exact resource ID.
        schema:
          type: string
          maxLength: 128
          x-max-utf8-bytes: 128
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/operations/{id}/reconciliations:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: listOperationReconciliations
      tags:
      - Operations
      summary: Read append-only outcome evidence
      description: 'Uses the same operation ownership, workspace and live client-grant checks as getOperation. Keyset
        order is immutable created_at DESC, id DESC. The first request supplies a creation-time upper bound retained
        in later cursors. total counts current authorized matches inside that boundary before the position cursor;
        live status and permissions can change it. Pages are not a frozen database snapshot. Unknown/repeated query
        fields are rejected. '
      x-required-roles:
      - admin
      - operator
      - approver
      - viewer
      parameters:
      - $ref: '#/components/parameters/HistoryLimit'
      - $ref: '#/components/parameters/HistoryCursor'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: reconcileOperation
      tags:
      - Operations
      summary: Append independent verification for an UNKNOWN operation
      description: Requires admin or approver in the operation workspace. The requester and any identity recorded
        as dispatching this operation cannot reconcile it; machine clients cannot write evidence. Only UNKNOWN operations
        accept evidence. expected_last_id is checked under an operation row lock; corrections append rather than edit
        history. Original state/result stay unchanged and this endpoint never invokes an upstream tool. Audit records
        contain record IDs and outcome, not the submitted evidence/note.
      x-required-roles:
      - admin
      - approver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileInput'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/capacity:
    get:
      operationId: listCapacityLimits
      tags:
      - Capacity
      summary: List admission defaults and workspace overrides
      description: Requires admin in the authenticated workspace. Limits apply to workspace, client and upstream admission
        before a business dispatch.
      x-required-roles:
      - admin
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityLimits'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/capacity/limits:
    post:
      operationId: updateCapacityLimit
      tags:
      - Capacity
      summary: Set a versioned admission limit
      description: Requires admin in the authenticated workspace. Request body is limited to 8192 bytes. Applies on
        later admissions without changing already admitted calls; successful updates increment version.
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapacityLimitInput'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityLimit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-max-request-body-bytes: 8192
  /api/v1/capacity/metrics:
    get:
      operationId: getCapacityMetrics
      tags:
      - Capacity
      summary: Read execution and admission aggregates
      description: Requires admin in the authenticated workspace. Reports recorded HTTP/MCP terminal outcomes, rejection
        counters and active leases.
      x-required-roles:
      - admin
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-gateway-session
      description: Secure cloud session; mutations additionally require the session CSRF token and configured Origin.
    bearerAuth:
      type: http
      scheme: bearer
      description: Expiring cloud personal API key, scoped machine-client key, or configured development token. Machine-client keys have live scope/grant checks and cannot administer resources. Identity, role and workspace are always supplied by the server.
  parameters:
    ToolQuery:
      name: query
      in: query
      required: false
      description: Case-insensitive literal substring of name plus description. Trimmed, at most 200 UTF-8 bytes; percent, underscore and backslash are literal.
      schema:
        type: string
        maxLength: 200
        x-max-utf8-bytes: 200
    ToolLimit:
      name: limit
      in: query
      required: false
      description: Page size; defaults to 50 for registry or 25 for discovery. Explicit zero is invalid.
      schema:
        type: integer
        minimum: 1
        maximum: 50
    ToolCursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque position returned by the preceding page. Bound to the actor, workspace,
        current role, query and registry/discovery scope; limit may change. Uses the
        first request's creation-time upper bound and does not grant access. Start a
        new search to include later-created tools. Live revocation still applies.
      schema:
        type: string
        maxLength: 2048
    ResourceID:
      name: id
      in: path
      required: true
      description: Server-generated tool, operation or MCP server ID. Lookups always use the authenticated workspace.
      schema:
        type: string
        format: uuid
    CredentialRef:
      name: ref
      in: path
      required: true
      description: Workspace credential reference.
      schema:
        type: string
        pattern: ^[A-Z][A-Z0-9_]{0,127}$
        maxLength: 128
    ClientID:
      name: id
      in: path
      required: true
      description: Server-generated client identifier; not a UUID.
      schema:
        type: string
    CandidateID:
      name: candidate
      in: path
      required: true
      description: Candidate belonging to this workspace and tool.
      schema:
        type: string
        format: uuid
    HistoryLimit:
      name: limit
      in: query
      required: false
      description: Number of history records per page; explicit zero is invalid.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    HistoryCursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset position bound to kind, workspace, actor, role, client/key identity and filters. Limit
        may change. Live permissions and filters are applied on every page.
      schema:
        type: string
        maxLength: 4096
    HistoryFrom:
      name: from
      in: query
      required: false
      description: Inclusive created_at lower bound, RFC3339 with optional nanoseconds. Years 1970-9999; must not exceed
        to.
      schema:
        type: string
        format: date-time
    HistoryTo:
      name: to
      in: query
      required: false
      description: Inclusive created_at upper bound, RFC3339 with optional nanoseconds. Years 1970-9999.
      schema:
        type: string
        format: date-time
    HistoryActor:
      name: actor_id
      in: query
      required: false
      description: Exact actor ID. A filter never broadens visibility.
      schema:
        type: string
        maxLength: 128
        x-max-utf8-bytes: 128
  requestBodies:
    EmptyAction:
      description: Send an empty JSON object with Content-Type application/json; an omitted body is rejected.
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            maxProperties: 0
          example: {}
  responses:
    MCPServer:
      description: Current registered MCP server with credential references only
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MCPServer'
    Tool:
      description: Current persisted tool definition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Tool'
    Operation:
      description: Current persisted operation; inspect state to determine business outcome
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
    BadRequest:
      description: Invalid JSON, unsupported fields, wrong Content-Type, schema mismatch or input outside configured limits
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Credential is missing, invalid, revoked or expired
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: 'Bearer realm="mcp-gateway"'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Role does not permit this action, independent-approver rule failed, or browser Origin is not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource is missing or not visible to this identity and workspace
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Duplicate tool name or namespace, conflicting idempotency key or MCP import contract, resource-count cap, stale resource version, incompatible operation state, disabled tool/server or expired approval
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: Durable request completion could not be confirmed; query an existing operation before attempting another action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Admission rejected before business dispatch. Retry-After is a positive number of seconds; wait and
        inspect/retry the same operation ID, never create a new idempotency key for an uncertain write. Application
        admission errors use capacity_exceeded. The outer request concurrency limiter may return a plain-text response.
      headers:
        Retry-After:
          description: Delay in seconds.
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
        text/plain:
          schema:
            type: string
    InternalError:
      description: Client administration could not be completed; no secret is included in the error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Role:
      type: string
      enum: [admin, operator, approver, viewer]
    Actor:
      type: object
      additionalProperties: false
      required: [id, workspace_id, role]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        client_id:
          type: string
          description: Present for a machine client; its ID is also the actor ID. Client key IDs are not exposed.
    Risk:
      type: string
      enum: [read, write]
      description: Administrator-declared risk. HTTP read tools must use GET. MCP read tools require an explicit administrator decision; remote annotations are only hints. Write operations require independent approval.
    MCPServerInput:
      type: object
      additionalProperties: false
      required: [name, namespace, url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          x-max-utf8-bytes: 120
          description: Display name, trimmed; 1-120 UTF-8 bytes without NUL, CR or LF.
        namespace:
          type: string
          minLength: 1
          maxLength: 24
          pattern: '^[a-z][a-z0-9_-]{0,23}$'
          description: Trimmed stable namespace unique within the authenticated workspace.
        url:
          type: string
          format: uri
          maxLength: 2048
          x-max-utf8-bytes: 2048
          description: Streamable HTTP MCP endpoint on an explicitly permitted HTTP(S) origin. Userinfo, query strings and fragments are rejected; redirects and resolved addresses remain subject to egress policy.
        credential_ref:
          type: string
          maxLength: 128
          pattern: '^$|^[A-Z][A-Z0-9_]{0,127}$'
          description: Optional reference to a server-managed credential bound to the workspace and exact endpoint origin.
        timeout_ms:
          type: integer
          default: 10000
          anyOf:
            - const: 0
            - minimum: 100
              maximum: 120000
          description: Deadline for the complete discovery or execution attempt, including handshake and contract verification. Omitted or zero becomes 10000.
    MCPServer:
      type: object
      additionalProperties: false
      required: [id, workspace_id, name, namespace, url, timeout_ms, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
        name:
          $ref: '#/components/schemas/MCPServerInput/properties/name'
        namespace:
          $ref: '#/components/schemas/MCPServerInput/properties/namespace'
        url:
          $ref: '#/components/schemas/MCPServerInput/properties/url'
        credential_ref:
          $ref: '#/components/schemas/MCPServerInput/properties/credential_ref'
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 120000
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MCPServerList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MCPServer'
        total:
          type: integer
          minimum: 0
          maximum: 100
    MCPConfig:
      type: object
      additionalProperties: false
      required: [server_id, tool_name, schema_hash]
      properties:
        server_id:
          type: string
          format: uuid
        tool_name:
          type: string
          minLength: 1
          maxLength: 128
          x-max-utf8-bytes: 128
          description: Exact remote tool name; the gateway alias is stored in Tool.name.
        schema_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of the canonical remote name and input/output schemas. Rechecked before upstream invocation.
    RemoteTool:
      type: object
      additionalProperties: false
      required: [name, description, input_schema, read_only_hint, schema_hash, gateway_name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          x-max-utf8-bytes: 128
          description: Exact upstream name; duplicates, control characters and invalid UTF-8 are rejected.
        description:
          type: string
          maxLength: 4000
          x-max-utf8-bytes: 4000
          description: Upstream business description, with a generated fallback when blank.
        input_schema:
          $ref: '#/components/schemas/InputSchema'
        output_schema:
          $ref: '#/components/schemas/OutputSchema'
        read_only_hint:
          type: boolean
          description: Untrusted upstream annotation. Administrators must explicitly choose risk during import; this value never grants execution.
        schema_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        gateway_name:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z][a-zA-Z0-9_.-]{0,63}$'
          description: Stable alias composed of namespace, sanitized/truncated remote name and an eight-hex-character name hash.
        imported_tool_id:
          type: string
          format: uuid
          description: Existing import ID, when present; not a guarantee that its pinned schema matches current discovery.
    RemoteToolList:
      type: object
      additionalProperties: false
      required: [items, total, review]
      x-max-upstream-result-bytes: 4194304
      x-max-upstream-pages: 100
      properties:
        review:
          $ref: '#/components/schemas/MCPCatalogReview'
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/RemoteTool'
        total:
          type: integer
          minimum: 0
          maximum: 1000
    MCPCatalogSchedule:
      type: object
      required: [server_id, enabled, interval_seconds, revision, next_check_at, lease_until, running, last_started_at, last_finished_at, last_success_at, consecutive_failures, last_error_code]
      properties:
        server_id: {type: string, format: uuid}
        enabled: {type: boolean}
        interval_seconds: {type: integer, minimum: 300, maximum: 86400}
        revision: {type: integer, minimum: 0}
        next_check_at: {type: [string, 'null'], format: date-time}
        lease_until: {type: [string, 'null'], format: date-time}
        running: {type: boolean}
        last_started_at: {type: [string, 'null'], format: date-time}
        last_finished_at: {type: [string, 'null'], format: date-time}
        last_success_at: {type: [string, 'null'], format: date-time}
        consecutive_failures: {type: integer, minimum: 0, maximum: 1000}
        last_error_code: {type: string, enum: ['', discovery_failed, timeout, server_changed, comparison_failed]}
    MCPCatalogReview:
      type: object
      required: [id, server_id, source, started_at, checked_at, counts, items]
      properties:
        id: {type: string, pattern: '^[0-9]+$'}
        server_id: {type: string, format: uuid}
        source: {type: string, enum: [manual, scheduled]}
        started_at: {type: string, format: date-time}
        checked_at: {type: string, format: date-time}
        counts:
          type: object
          required: [unimported, unchanged, schema_changed, description_changed, missing]
          properties:
            unimported: {type: integer, minimum: 0}
            unchanged: {type: integer, minimum: 0}
            schema_changed: {type: integer, minimum: 0}
            description_changed: {type: integer, minimum: 0}
            missing: {type: integer, minimum: 0}
        items:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [name, gateway_name, status, imported_enabled]
            properties:
              name: {type: string}
              gateway_name: {type: string}
              status:
                type: string
                enum: [unimported, unchanged, schema_changed, description_changed, missing]
              schema_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
              imported_tool_id: {type: string, format: uuid}
              imported_version: {type: integer, minimum: 1}
              imported_schema_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
              imported_status: {type: string, enum: [draft, published, retired]}
              imported_enabled: {type: boolean}
    ImportInput:
      type: object
      additionalProperties: false
      required: [tool_name, schema_hash, risk]
      properties:
        tool_name:
          type: string
          minLength: 1
          maxLength: 256
          x-max-utf8-bytes: 256
          description: Exact name selected from current discovery. The accepted discovery catalog itself limits remote names to 128 UTF-8 bytes.
        schema_hash:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
          description: Use the exact lowercase hash returned by discovery; a nonmatching contract returns 409.
        risk:
          $ref: '#/components/schemas/Risk'
        response_policy:
          $ref: '#/components/schemas/ResponsePolicy'
    ResponsePolicy:
      type: object
      additionalProperties: false
      description: |
        Versioned MCP response policy captured immutably by each prepared operation. A missing
        policy uses max_bytes 65536 and includes all structured fields. The adapter
        first validates the original structuredContent against output_schema; this
        policy then redacts common secret field names and applies optional selection.
        It is not a general-purpose sensitive-data detector.

        Selection starts at a structuredContent object. A full nonfinal * segment
        traverses every array element, as in /results/*/title; fields selected for
        the same element are merged and array order and length are preserved.
        This is a Gateway extension to JSON Pointer escaping, not RFC 6901 wildcard
        semantics. Numeric array indexes and object wildcards are unsupported.
        Missing fields or type mismatches in any element fail the whole projection.
        Empty arrays and null leaf values are valid. Root nextCursor and next_cursor are
        preserved as pagination control data when strings or null; other cursor types
        are rejected during selection. A successful structured result's text
        content is rebuilt from the projected object, so the original text cannot
        bypass selection. Text-only results support byte limits, but cannot use
        include paths. Oversized results are rejected, never sliced into invalid
        JSON. A post-call projection/limit failure is FAILED for read operations
        and UNKNOWN for writes, which require outcome verification before retry.
      properties:
        include:
          type: array
          maxItems: 32
          uniqueItems: true
          default: []
          items:
            type: string
            minLength: 2
            maxLength: 256
            x-max-utf8-bytes: 256
            description: JSON Pointer-style selector using ~0 and ~1 escapes. A full nonfinal '*' segment selects each array element. Empty segments, NUL, partial/final stars, duplicates, ancestor/descendant overlap and mixed object/array traversal at one node are rejected. Numeric object keys are supported; numeric array indexes are not.
          description: Optional allowlist sorted during normalization. Empty or absent selects all structured fields after common-secret redaction.
        max_bytes:
          type: integer
          default: 65536
          anyOf:
            - const: 0
            - minimum: 1024
              maximum: 131072
          description: Maximum serialized UTF-8 bytes of the final MCP result envelope, including regenerated text and projection metadata. Omitted or zero becomes 65536; stored values are 1024-131072.
    ResponsePolicyUpdateInput:
      type: object
      additionalProperties: false
      required: [expected_version, response_policy]
      properties:
        expected_version:
          type: integer
          minimum: 1
        response_policy:
          $ref: '#/components/schemas/ResponsePolicy'
    ResponsePolicyPreviewInput:
      type: object
      additionalProperties: false
      required: [expected_version, response_policy, sample]
      properties:
        expected_version:
          type: integer
          minimum: 1
        response_policy:
          $ref: '#/components/schemas/ResponsePolicy'
        sample:
          $ref: '#/components/schemas/MCPResponseSample'
    MCPResponseSample:
      type: object
      required: [isError, content]
      description: Successful MCP envelope supplied by the administrator. Unsupported top-level fields and text block metadata are ignored. structuredContent is required when the tool declares output_schema and must satisfy it before projection. Browser editing rejects unsafe JavaScript numbers; direct API clients can preserve large JSON integers.
      properties:
        isError:
          const: false
        content:
          type: array
          items:
            type: object
            required: [type, text]
            properties:
              type:
                const: text
              text:
                type: string
        structuredContent:
          type: object
          additionalProperties: true
    ResponsePolicyPreview:
      type: object
      additionalProperties: false
      required: [tool_version, original_bytes, projected_bytes, result]
      properties:
        tool_version:
          type: integer
          minimum: 1
        original_bytes:
          type: integer
          minimum: 0
          description: UTF-8 bytes after normalizing the supported sample envelope to the same shape used by the adapter; excludes ignored metadata. Not raw network size or a token estimate.
        projected_bytes:
          type: integer
          minimum: 0
          maximum: 131072
          description: UTF-8 bytes of the final serialized result envelope, including regenerated text and projection metadata.
        result:
          type: object
          additionalProperties: true
          description: Projected MCP result, using the same policy implementation as live execution.
    EmptyHTTPConfig:
      type: object
      additionalProperties: false
      required: [url, method, timeout_ms]
      description: Serialization placeholder on imported MCP tools; unused for routing.
      properties:
        url:
          const: ''
        method:
          const: ''
        timeout_ms:
          const: 0
    HTTPConfigInput:
      type: object
      additionalProperties: false
      required: [url, method]
      properties:
        url:
          type: string
          format: uri
          description: HTTP(S) URL on an explicitly allowed origin. Userinfo, query strings and fragments are rejected. Network policy is checked again at execution.
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
          description: Canonical HTTP method; the server trims and uppercases input. Risk read requires GET.
        credential_ref:
          type: string
          maxLength: 128
          pattern: '^$|^[A-Z][A-Z0-9_]{0,127}$'
          description: Optional credential reference bound to the authenticated workspace and exact HTTP origin. This is not a credential value.
        timeout_ms:
          type: integer
          default: 10000
          anyOf:
            - const: 0
            - minimum: 100
              maximum: 120000
          description: Downstream deadline in milliseconds. Omitted or zero is normalized to 10000.
    HTTPConfig:
      allOf:
        - $ref: '#/components/schemas/HTTPConfigInput'
        - type: object
          required: [timeout_ms]
          properties:
            timeout_ms:
              type: integer
              minimum: 100
              maximum: 120000
    InputSchema:
      type: object
      required: [type]
      properties:
        type:
          const: object
      additionalProperties: true
      x-max-encoded-bytes: 65536
      description: |
        JSON Schema document whose root type is exactly object. Must compile with
        the bundled validator. Local definitions and references are allowed;
        external reference loading is disabled. Encoded size is limited to 65536
        bytes. Maximum JSON nesting is 64 levels; numeric text is limited to 1024
        bytes with exponent between -1000 and 1000, and NUL strings/keys are rejected.
    OutputSchema:
      type: object
      additionalProperties: true
      x-max-encoded-bytes: 65536
      description: Optional JSON Schema document for downstream results. For MCP tools, validates the original structuredContent before response redaction/projection, not the stored envelope or projected object. Must be an object and compile without external references. Uses the same size and structural limits as input_schema; its declared result type need not be object.
    ToolInput:
      type: object
      additionalProperties: false
      required: [name, description, risk, input_schema, http]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-zA-Z][a-zA-Z0-9_.-]{0,63}$'
          description: Unique within a workspace after trimming surrounding whitespace.
        description:
          type: string
          minLength: 1
          maxLength: 4000
          x-max-encoded-bytes: 4000
          description: Business purpose; trimmed, nonempty and at most 4000 UTF-8 bytes.
        risk:
          $ref: '#/components/schemas/Risk'
        input_schema:
          $ref: '#/components/schemas/InputSchema'
        output_schema:
          $ref: '#/components/schemas/OutputSchema'
        http:
          $ref: '#/components/schemas/HTTPConfigInput'
    Tool:
      type: object
      additionalProperties: false
      required: [id, workspace_id, name, description, risk, input_schema, http, enabled, status, version, created_at]
      description: HTTP tools contain an active http definition. Imported MCP tools contain mcp and response_policy, with an empty http placeholder. This management representation does not contain the MCP platform get_tool_schema result_format hint.
      allOf:
        - if:
            required: [mcp]
          then:
            required: [response_policy]
            properties:
              http:
                $ref: '#/components/schemas/EmptyHTTPConfig'
          else:
            properties:
              http:
                $ref: '#/components/schemas/HTTPConfig'
              response_policy: false
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
        name:
          type: string
        description:
          type: string
        risk:
          $ref: '#/components/schemas/Risk'
        input_schema:
          $ref: '#/components/schemas/InputSchema'
        output_schema:
          $ref: '#/components/schemas/OutputSchema'
        http:
          oneOf:
            - $ref: '#/components/schemas/HTTPConfig'
            - $ref: '#/components/schemas/EmptyHTTPConfig'
        mcp:
          $ref: '#/components/schemas/MCPConfig'
        response_policy:
          $ref: '#/components/schemas/ResponsePolicy'
        enabled:
          type: boolean
          description: Effective visibility flag; false when the imported tool's upstream server is disabled, while its independent stored flag is preserved.
        status:
          type: string
          enum: [draft, published, retired]
        version:
          type: integer
          minimum: 1
          description: Content version captured by prepared operations. New tools start at 1; policy changes, candidate publication and retirement increment it. Existing operation snapshots remain unchanged.
        created_at:
          type: string
          format: date-time
    ToolList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Tool'
        next_cursor:
          type: string
          maxLength: 2048
          description: Omitted or empty on the last page.
        total:
          type: integer
          minimum: 0
          description: Visible matches inside the creation-time boundary, before the cursor position. Publication or disablement can change this live count.
    ToolSummary:
      type: object
      additionalProperties: false
      required: [id, name, description, risk, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          maxLength: 512
          x-max-utf8-bytes: 512
          description: Discovery excerpt limited to 512 UTF-8 bytes including an ellipsis when truncated. Fetch the tool by ID for the complete description; search still matches its full stored text.
        risk:
          $ref: '#/components/schemas/Risk'
        version:
          type: integer
          minimum: 1
    ToolDiscoveryPage:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ToolSummary'
        next_cursor:
          type: string
          maxLength: 2048
        total:
          type: integer
          minimum: 0
    PrepareInput:
      type: object
      additionalProperties: false
      required: [tool_id, arguments, idempotency_key]
      properties:
        tool_id:
          type: string
          format: uuid
        arguments:
          type: object
          additionalProperties: true
          x-max-encoded-bytes: 262144
          description: |
            Must satisfy the selected tool's input_schema. The entire HTTP request,
            including this object and metadata, must fit within 262144 bytes.
            Nesting depth is at most 64; NUL strings/keys are rejected. Number text
            is bounded to 1024 bytes and exponents to -1000 through 1000.
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
          x-max-encoded-bytes: 128
          description: Stable client-generated key, 8-128 UTF-8 bytes, with no leading or trailing whitespace. Unique within the workspace and bound to actor, tool and argument hash.
    OperationState:
      type: string
      enum: [WAITING_APPROVAL, READY, DISPATCHING, SUCCEEDED, FAILED, UNKNOWN, REJECTED]
      description: |
        WAITING_APPROVAL needs independent review. READY may be claimed once.
        DISPATCHING means execution was admitted and may already have reached the
        downstream service. SUCCEEDED is a confirmed adapter result; FAILED is a
        reported failure. UNKNOWN requires downstream verification and cannot be
        replayed automatically. Reconciliation adds evidence while retaining UNKNOWN.
        REJECTED includes rejected or expired approval.
    Operation:
      type: object
      additionalProperties: false
      required: [id, workspace_id, tool_id, tool_name, tool_version, risk, actor_id, arguments, arguments_hash, idempotency_key, state, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
        tool_id:
          type: string
          format: uuid
        tool_name:
          type: string
        tool_version:
          type: integer
          minimum: 1
        risk:
          $ref: '#/components/schemas/Risk'
        actor_id:
          type: string
          description: Identity that prepared the operation.
        arguments:
          type: object
          additionalProperties: true
          description: Fixed stored arguments. They cannot be changed by approval or execution calls.
        arguments_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of canonical argument bytes.
        idempotency_key:
          type: string
        state:
          $ref: '#/components/schemas/OperationState'
        result:
          description: Optional stored JSON value after adapter validation and redaction. HTTP results can be any JSON type, including null. Successful MCP results contain a bounded envelope with isError false, content and optional structuredContent/gateway_projection; output_schema applies to original structuredContent before projection.
        error:
          type: string
          description: Optional bounded error summary; inspect state rather than this text for control flow.
        approved_by:
          type: string
          description: Present after approval; always different from actor_id.
        approval_expires_at:
          type: string
          format: date-time
          description: Present after approval. Approval expiry is rechecked before dispatch.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OperationList:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
          maxItems: 100
        next_cursor:
          type: string
          maxLength: 4096
          description: Omitted on the final page.
        total:
          type: integer
          minimum: 0
    Event:
      type: object
      additionalProperties: false
      required: [id, operation_id, type, actor_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: Global sequence value, suitable as the exclusive after cursor; IDs can contain gaps.
        operation_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [OPERATION_PREPARED, OPERATION_APPROVED, OPERATION_REJECTED, OPERATION_DISPATCHING, OPERATION_SUCCEEDED, OPERATION_FAILED, OPERATION_UNKNOWN, APPROVAL_EXPIRED]
        actor_id:
          type: string
          description: Acting identity or system for automated recovery/expiry events.
        created_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
          description: Event-specific metadata, such as state, arguments_hash, tool_version, expires_at or recovery reason. Full arguments and results remain on the operation.
    EventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Event'
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [unauthorized, forbidden, not_found, conflict, approval_expired, invalid_input, unavailable]
            message:
              type: string

    CredentialHeaders:
      type: object
      minProperties: 1
      maxProperties: 16
      propertyNames:
        type: string
        minLength: 1
        maxLength: 128
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 8192
        x-max-utf8-bytes: 8192
      writeOnly: true
      description: Secret HTTP headers, accepted only on create/rotate. Names must be ASCII HTTP tokens with case-insensitive
        uniqueness. Values must not contain controls; total name/value UTF-8 bytes <=32768. Reserved transport, idempotency
        and MCP headers are rejected. Never returned or recorded in audit data.
    CredentialMetadata:
      type: object
      additionalProperties: false
      required:
      - ref
      - origin
      - version
      - enabled
      - header_names
      - created_at
      - updated_at
      properties:
        ref:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,127}$
        origin:
          type: string
          format: uri
        version:
          type: integer
          minimum: 1
        enabled:
          type: boolean
        header_names:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 16
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: Secret-free metadata. Exact origin and reference are immutable; version changes on rotation or enabled-state
        change.
    CredentialList:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialMetadata'
          maxItems: 1000
        total:
          type: integer
          minimum: 0
    CredentialCreateInput:
      type: object
      additionalProperties: false
      required:
      - ref
      - origin
      - headers
      properties:
        ref:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,127}$
          maxLength: 128
        origin:
          type: string
          format: uri
          description: Exact permitted scheme://host[:port] origin; no path, query, userinfo or fragment. Registering
            a credential does not extend the deployment allowlist.
        headers:
          $ref: '#/components/schemas/CredentialHeaders'
    CredentialRotateInput:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - headers
      properties:
        expected_version:
          type: integer
          minimum: 1
          description: Current resource version. Stale values return 409 even for an otherwise identical request.
        headers:
          $ref: '#/components/schemas/CredentialHeaders'
    CredentialEnabledInput:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - enabled
      properties:
        expected_version:
          type: integer
          minimum: 1
          description: Current resource version. Stale values return 409 even for an otherwise identical request.
        enabled:
          type: boolean
    ToolCompatibility:
      type: object
      additionalProperties: false
      required:
      - name
      - status
      - code
      - message
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - compatible
          - incompatible
        code:
          type: string
        message:
          type: string
    MCPCheck:
      type: object
      additionalProperties: false
      required:
      - id
      - server_id
      - checked_at
      - status
      - stage
      - code
      - message
      - duration_ms
      - compatible_count
      - incompatible_count
      - tools
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 19
          description: Database int64 sequence encoded as a decimal string; do not convert to a JavaScript number.
        server_id:
          type: string
          format: uuid
        checked_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ok
          - degraded
          - failed
        stage:
          type: string
          enum:
          - policy
          - authentication
          - connect
          - discovery
          - compatibility
          - complete
        code:
          type: string
        message:
          type: string
        duration_ms:
          type: integer
          minimum: 0
        compatible_count:
          type: integer
          minimum: 0
        incompatible_count:
          type: integer
          minimum: 0
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolCompatibility'
          maxItems: 1000
      description: Safe connection/definition diagnostic. A successful check does not demonstrate business execution;
        no tools/call is made. No raw upstream error, credentials or full schema is exposed.
    MCPCheckPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MCPCheck'
          maxItems: 50
        next_cursor:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 19
          description: Database int64 sequence encoded as a decimal string; do not convert to a JavaScript number.
    Client:
      type: object
      additionalProperties: false
      required:
      - id
      - workspace_id
      - name
      - enabled
      - version
      - scopes
      - server_ids
      - tool_ids
      - key_id
      - key_created_at
      - key_expires_at
      - created_at
      - updated_at
      properties:
        id:
          type: string
        workspace_id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 120
        enabled:
          type: boolean
        version:
          type: integer
          minimum: 1
        scopes:
          type: array
          items:
            type: string
            enum:
            - tools:read
            - tools:invoke
          maxItems: 2
          uniqueItems: true
          description: tools:invoke requires tools:read. Empty scopes grant no tool access.
        server_ids:
          type: array
          items:
            type: string
            maxLength: 128
            x-max-utf8-bytes: 128
          maxItems: 100
          description: Explicit IDs in this workspace. Empty means no grants of this kind. Duplicate IDs are normalized.
        tool_ids:
          type: array
          items:
            type: string
            maxLength: 128
            x-max-utf8-bytes: 128
          maxItems: 1000
          description: Explicit IDs in this workspace. Empty means no grants of this kind. Duplicate IDs are normalized.
        key_id:
          type: string
        key_created_at:
          type: string
          format: date-time
        key_expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ClientList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Client'
          maxItems: 500
    IssuedClientKey:
      type: object
      additionalProperties: false
      required:
      - client
      - api_key
      properties:
        client:
          $ref: '#/components/schemas/Client'
        api_key:
          type: string
          description: One-time plaintext bearer key. Save securely now; list and update responses cannot retrieve it.
    ClientCreateInput:
      type: object
      additionalProperties: false
      required:
      - name
      - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          items:
            type: string
            enum:
            - tools:read
            - tools:invoke
          maxItems: 2
          uniqueItems: true
          description: tools:invoke requires tools:read. Empty scopes grant no tool access.
        server_ids:
          type: array
          items:
            type: string
            maxLength: 128
            x-max-utf8-bytes: 128
          maxItems: 100
          description: Explicit IDs in this workspace. Empty means no grants of this kind. Duplicate IDs are normalized.
        tool_ids:
          type: array
          items:
            type: string
            maxLength: 128
            x-max-utf8-bytes: 128
          maxItems: 1000
          description: Explicit IDs in this workspace. Empty means no grants of this kind. Duplicate IDs are normalized.
        expires_at:
          type: string
          format: date-time
          description: Future expiry no more than 366 days away; omitted defaults to 30 days.
    ClientUpdateInput:
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version:
          type: integer
          minimum: 1
          description: Current resource version. Stale values return 409 even for an otherwise identical request.
        name:
          type: string
          minLength: 1
          maxLength: 120
        enabled:
          type: boolean
        scopes:
          type: array
          items:
            type: string
            enum:
            - tools:read
            - tools:invoke
          maxItems: 2
          uniqueItems: true
          description: tools:invoke requires tools:read. Empty scopes grant no tool access.
        server_ids:
          type: array
          items:
            type: string
            maxLength: 128
            x-max-utf8-bytes: 128
          maxItems: 100
          description: Explicit IDs in this workspace. Empty means no grants of this kind. Duplicate IDs are normalized.
        tool_ids:
          type: array
          items:
            type: string
            maxLength: 128
            x-max-utf8-bytes: 128
          maxItems: 1000
          description: Explicit IDs in this workspace. Empty means no grants of this kind. Duplicate IDs are normalized.
      description: Omitted fields preserve current values; an explicit empty grant/scope array clears it. Every successful
        update increments version.
    ClientRotateInput:
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version:
          type: integer
          minimum: 1
          description: Current resource version. Stale values return 409 even for an otherwise identical request.
        expires_at:
          type: string
          format: date-time
          description: Future expiry no more than 366 days away; omitted defaults to 30 days.
    ToolDefinition:
      type: object
      additionalProperties: false
      required:
      - name
      - description
      - risk
      - input_schema
      - http
      properties:
        name:
          $ref: '#/components/schemas/ToolInput/properties/name'
        description:
          $ref: '#/components/schemas/ToolInput/properties/description'
        risk:
          $ref: '#/components/schemas/Risk'
        input_schema:
          $ref: '#/components/schemas/InputSchema'
        output_schema:
          $ref: '#/components/schemas/OutputSchema'
        http:
          oneOf:
          - $ref: '#/components/schemas/HTTPConfig'
          - $ref: '#/components/schemas/EmptyHTTPConfig'
        mcp:
          $ref: '#/components/schemas/MCPConfig'
        response_policy:
          $ref: '#/components/schemas/ResponsePolicy'
      description: Normalized versioned definition. MCP definitions include mcp/response_policy and an empty http placeholder;
        HTTP definitions use http and omit MCP fields. Historical definitions do not imply that the upstream still supports
        them.
    ToolVersion:
      type: object
      additionalProperties: false
      required:
      - version
      - definition
      - created_at
      properties:
        version:
          type: integer
          minimum: 1
        definition:
          $ref: '#/components/schemas/ToolDefinition'
        created_at:
          type: string
          format: date-time
    ToolVersionPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ToolVersion'
          maxItems: 100
        next_cursor:
          type: integer
          minimum: 1
          description: Exclusive version cursor; supply as before on the next request. Omitted on last page.
    ToolChange:
      type: object
      additionalProperties: false
      required:
      - field
      - before
      - after
      properties:
        field:
          type: string
        before: {}
        after: {}
    ToolCandidate:
      type: object
      additionalProperties: false
      required:
      - id
      - tool_id
      - base_version
      - definition
      - changes
      - reason
      - created_by
      - created_at
      properties:
        id:
          type: string
          format: uuid
        tool_id:
          type: string
          format: uuid
        base_version:
          type: integer
          minimum: 1
        source_version:
          type: integer
          minimum: 1
        definition:
          $ref: '#/components/schemas/ToolDefinition'
        changes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ToolChange'
          description: Detailed diff on create/detail responses; the compact candidate list may return null.
        reason:
          type: string
          maxLength: 1000
          x-max-utf8-bytes: 1000
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        published_version:
          type: integer
          minimum: 1
    ToolCandidateList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ToolCandidate'
          maxItems: 100
    ToolCandidateInput:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - reason
      properties:
        expected_schema_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Optional precondition for MCP refresh. Live schema must match the discovery reviewed by the caller or return 409. Not a replacement schema. Invalid with rollback/HTTP definition mode.
        expected_version:
          type: integer
          minimum: 1
          description: Current resource version. Stale values return 409 even for an otherwise identical request.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          x-max-utf8-bytes: 1000
        source_version:
          type: integer
          minimum: 1
        server_id:
          type: string
          format: uuid
        tool_name:
          type: string
          minLength: 1
          maxLength: 128
        risk:
          $ref: '#/components/schemas/Risk'
        response_policy:
          $ref: '#/components/schemas/ResponsePolicy'
        definition:
          $ref: '#/components/schemas/ToolInput'
      description: 'Choose one mode: source_version copies a historical definition and cannot accompany any override;
        definition replaces an HTTP definition and cannot accompany MCP fields; otherwise an MCP candidate discovers
        server_id/tool_name (defaulting to the current binding), with optional explicit risk/policy overrides. Gateway
        name is immutable. Candidate creation and publication both validate the live target; the effective schema hash is always derived from the live upstream. An optional expected_schema_hash
        only constrains that observation.'
    ExpectedVersionInput:
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version:
          type: integer
          minimum: 1
          description: Current resource version. Stale values return 409 even for an otherwise identical request.
    DiscardedCandidate:
      type: object
      additionalProperties: false
      required:
      - discarded
      properties:
        discarded:
          const: true
    AuditEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - actor_id
      - action
      - resource_id
      - data
      - created_at
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 19
          description: Database int64 sequence encoded as a decimal string; do not convert to a JavaScript number.
        actor_id:
          type: string
        action:
          type: string
        resource_id:
          type: string
        data: {}
        created_at:
          type: string
          format: date-time
      description: Action-specific metadata scoped to the workspace. Credential values and reconciliation note/evidence
        text are not copied into audit payloads.
    AuditPage:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
          maxItems: 100
        next_cursor:
          type: string
          maxLength: 4096
          description: Omitted on the final page.
        total:
          type: integer
          minimum: 0
    ReconciliationOutcome:
      type: string
      enum:
      - confirmed_success
      - confirmed_failure
      - inconclusive
    Reconciliation:
      type: object
      additionalProperties: false
      required:
      - id
      - operation_id
      - outcome
      - evidence_ref
      - note
      - actor_id
      - created_at
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 19
          description: Database int64 sequence encoded as a decimal string; do not convert to a JavaScript number.
        operation_id:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/ReconciliationOutcome'
        evidence_ref:
          type: string
        note:
          type: string
        actor_id:
          type: string
        created_at:
          type: string
          format: date-time
      description: Immutable human evidence. Does not change the operation UNKNOWN state or dispatch any tool; later
        corrections append another record.
    ReconciliationPage:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Reconciliation'
          maxItems: 100
        next_cursor:
          type: string
          maxLength: 4096
          description: Omitted on the final page.
        total:
          type: integer
          minimum: 0
    ReconcileInput:
      type: object
      additionalProperties: false
      required:
      - expected_last_id
      - outcome
      - evidence_ref
      - note
      properties:
        expected_last_id:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
          maxLength: 19
          description: Latest reconciliation ID as a string, or "0" for the first entry. Concurrent/stale appends return
            409.
        outcome:
          $ref: '#/components/schemas/ReconciliationOutcome'
        evidence_ref:
          type: string
          minLength: 1
          maxLength: 2048
          x-max-utf8-bytes: 2048
          description: Trimmed HTTPS URL without userinfo, query or fragment; or a plain record identifier matching
            ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$. Do not paste credentials or sensitive payloads.
        note:
          type: string
          minLength: 1
          maxLength: 2000
          x-max-utf8-bytes: 2000
          description: Required trimmed explanation, no NUL. Visible to identities permitted to read this operation.
    CapacityScope:
      type: string
      enum:
      - workspace
      - client
      - upstream
    CapacityLimit:
      type: object
      additionalProperties: false
      required:
      - scope
      - scope_id
      - version
      - max_concurrent
      - requests_per_minute
      - updated_at
      properties:
        scope:
          $ref: '#/components/schemas/CapacityScope'
        scope_id:
          type: string
        version:
          type: integer
          minimum: 0
        max_concurrent:
          type: integer
          minimum: 1
          maximum: 256
        requests_per_minute:
          type: integer
          minimum: 1
          maximum: 60000
        updated_at:
          type: string
          format: date-time
      description: Persisted overrides have version >=1. Defaults use version 0, empty scope_id and zero updated_at;
        they are fallback templates, not stored overrides.
    CapacityLimits:
      type: object
      additionalProperties: false
      required:
      - defaults
      - items
      - total
      properties:
        defaults:
          type: array
          items:
            $ref: '#/components/schemas/CapacityLimit'
          maxItems: 3
        items:
          type: array
          items:
            $ref: '#/components/schemas/CapacityLimit'
        total:
          type: integer
          minimum: 0
      description: 'Defaults: workspace 32 concurrent/600 requests per minute; client and upstream each 8 concurrent/120
        per minute. total counts stored overrides.'
    CapacityLimitInput:
      type: object
      additionalProperties: false
      required:
      - scope
      - scope_id
      - expected_version
      - max_concurrent
      - requests_per_minute
      properties:
        scope:
          $ref: '#/components/schemas/CapacityScope'
        scope_id:
          type: string
          minLength: 1
          maxLength: 512
          x-max-utf8-bytes: 512
          description: workspace uses "*"; client uses a workspace client ID; upstream uses "mcp:<serverID>" or "http:<scheme://host[:port]>"
            (for example http:https://api.example.com).
        expected_version:
          type: integer
          minimum: 0
          description: Use 0 to create a missing override; otherwise the current stored version. A stale value returns
            409.
        max_concurrent:
          type: integer
          minimum: 1
          maximum: 256
        requests_per_minute:
          type: integer
          minimum: 1
          maximum: 60000
    CallMetric:
      type: object
      additionalProperties: false
      required:
      - transport
      - state
      - count
      - duration_ms_total
      properties:
        transport:
          type: string
          enum:
          - http
          - mcp
        state:
          type: string
          enum:
          - SUCCEEDED
          - FAILED
          - UNKNOWN
        count:
          type: integer
          minimum: 0
        duration_ms_total:
          type: integer
          minimum: 0
    RejectionMetric:
      type: object
      additionalProperties: false
      required:
      - scope
      - reason
      - count
      properties:
        scope:
          type: string
        reason:
          type: string
        count:
          type: integer
          minimum: 0
    CapacityMetrics:
      type: object
      additionalProperties: false
      required:
      - calls
      - rejections
      - active_leases
      - observed_at
      properties:
        calls:
          type: array
          items:
            $ref: '#/components/schemas/CallMetric'
        rejections:
          type: array
          items:
            $ref: '#/components/schemas/RejectionMetric'
        active_leases:
          type: integer
          minimum: 0
        observed_at:
          type: string
          format: date-time
      description: Workspace aggregates and active admission leases. Duration totals are not latency percentiles; no
        per-request payloads are returned.
