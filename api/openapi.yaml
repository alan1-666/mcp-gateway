openapi: 3.1.0
info:
  title: Rillgate Management and Execution API
  version: 0.1.0
  description: |
    HTTP contract for the implemented tool registry, remote MCP server management,
    scoped clients, encrypted credentials, reviewed tool releases, approval, durable
    execution, audit and capacity APIs.
    The MCP transport is exposed separately and is not described by this document.

    These endpoints require a bearer identity or a cloud browser session. Its workspace,
    actor ID and role come from the server; clients cannot select a workspace or role in
    a request. All resource lookups are scoped to that workspace. A supplied browser
    Origin must appear in the server's allowed-origin configuration. Cloud session
    mutations also require X-CSRF-Token. Account endpoints are documented separately
    in docs/cloud-deployment.md and require browser sessions for administration.

    POST requests require Content-Type application/json and one JSON object, with a
    maximum request body of 262144 bytes. Unknown request fields are rejected. Actions
    without arguments still require the body {}. Successful creation and action
    responses use HTTP 200, except machine client creation (201). Capacity-limit
    updates have a smaller 8192-byte body limit. Any authenticated endpoint may return
    429 with Retry-After under the outer request concurrency limiter. An HTTP 200 response containing an Operation
    does not imply that the downstream action succeeded: inspect its state.

    Tool registry and discovery use bounded keyset pages with next_cursor and total.
    Search filters the complete authorized catalog before applying the page size.
    Operations and audit use filtered keyset pages; event polling provides an exclusive
    event-ID cursor. These endpoints return JSON, not SSE. Management records expose credential
    references rather than credential values. Raw downstream headers are not returned;
    MCP result filtering and its limits are described by ResponsePolicy.
servers:
  - url: /
    description: The origin serving the Gateway HTTP API
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: Identity
  - name: Tools
  - name: Operations
  - name: MCP Servers
  - name: Credentials
  - name: Clients
  - name: Audit
  - name: Capacity
x-max-request-body-bytes: 262144
paths:
  /api/v1/me:
    get:
      operationId: getIdentity
      tags: [Identity]
      summary: Read the authenticated identity
      description: Available to all configured roles. Returns the trusted actor and workspace associated with the credential.
      x-required-roles: [admin, operator, approver, viewer]
      responses:
        '200':
          description: Authenticated identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/mcp/servers:
    get:
      operationId: listMCPServers
      tags: [MCP Servers]
      summary: List registered remote MCP servers
      description: |
        Requires admin. Returns every server in the authenticated workspace,
        including disabled servers. At most 100 servers are supported per workspace;
        an over-capacity catalog is rejected rather than silently truncated.
        Credentials are represented by references, never their values.
      x-required-roles: [admin]
      responses:
        '200':
          description: Complete workspace MCP server registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPServerList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createMCPServer
      tags: [MCP Servers]
      summary: Register an enabled remote MCP server
      description: |
        Requires admin. Registers a Streamable HTTP MCP endpoint with a namespace
        unique within the workspace. The origin must be explicitly allowed and
        any credential reference must be bound to that workspace and exact origin.
        Registration validates configuration but does not import or publish tools.
        The target, namespace and credential reference are immutable; there is no
        edit or delete endpoint. Discovery is a separate network operation.
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPServerInput'
      responses:
        '200':
          $ref: '#/components/responses/MCPServer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/mcp/servers/{id}/enabled:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: setMCPServerEnabled
      tags: [MCP Servers]
      summary: Enable or disable a registered MCP server
      description: |
        Requires admin. Repeating the current value is idempotent. Disabling removes
        imported tools from discovery and non-admin registry results, and blocks new
        preparations, approvals, dispatch admission, publication and tool enabling.
        It also blocks discovery and import from that server. Admins retain tool
        diagnostics with effective enabled false. Re-enabling preserves each tool's
        independent published/enabled state. An already admitted downstream request
        is not guaranteed to be cancelled; recorded results are retained.
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/MCPServer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/mcp/servers/{id}/discover:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: discoverMCPServerTools
      tags: [MCP Servers]
      summary: Discover and inspect the current upstream tool catalog
      description: |
        Requires admin and an enabled server. Initializes an isolated MCP session
        and reads every tools/list page within the configured server timeout. The
        complete catalog is returned only when discovery succeeds; partial results
        are never treated as a complete inventory. Limits are 1000 tools, 100 pages,
        4194304 cumulative upstream result bytes and 65536 bytes per schema.
        Malformed, duplicate or unsupported definitions, repeated cursors, excess
        limits and upstream failure reject discovery. Gateway metadata and JSON
        encoding may make the returned management document larger than the upstream
        byte budget, but the document remains bounded by these limits.

        Remote annotations are advisory. Discovery does not publish tools or update
        existing imports. gateway_name is a stable namespace alias with a hash
        suffix; imported_tool_id links a previously imported definition, even when
        the upstream schema has subsequently changed. The review object compares the complete remote
        catalog with registered definitions and records counts and per-tool state. Successful
        discoveries persist an observation and audit event atomically, retaining 50 reports per server.
        At most 2000 entries in the union and 2 MiB per report; excess fails without saving a partial
        report. A server changed/disabled during discovery returns 409. No tool is automatically
        imported, published, retired, reclassified or invoked.
      x-required-roles: [admin]
      requestBody:
        $ref: '#/components/requestBodies/EmptyAction'
      responses:
        '200':
          description: Complete bounded upstream catalog for administrative review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteToolList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/mcp/servers/{id}/catalog-schedule:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getMCPCatalogSchedule
      summary: Read scheduled catalog check settings and latest outcome
      x-required-roles: [admin]
      description: Human administrator only. New servers return a disabled schedule with revision 0 and a one-hour interval. Does not contact the upstream. A disabled server pauses checks even when its schedule is enabled.
      responses:
        '200':
          description: Schedule configuration and background status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MCPCatalogSchedule'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: setMCPCatalogSchedule
      summary: Configure opt-in background catalog checks
      x-required-roles: [admin]
      description: |
        Requires the last read configuration revision. A changed enabled configuration becomes due
        immediately; an identical save is a no-op. Editing or pausing fences in-flight results.
        Metadata discovery never publishes, retires or invokes a business tool. Failed checks preserve
        successful history and back off exponentially from the configured interval, capped at 24 hours.
        Disabling the server pauses the schedule. Re-enabling permits overdue work on the next worker poll.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, interval_seconds, expected_revision]
              properties:
                enabled: {type: boolean}
                interval_seconds: {type: integer, minimum: 300, maximum: 86400}
                expected_revision: {type: integer, minimum: 0}
      responses:
        '200':
          description: Saved schedule with current revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MCPCatalogSchedule'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/mcp/servers/{id}/catalog-reviews:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listMCPCatalogReviews
      summary: Read successful upstream catalog comparisons
      description: |
        Admin only. Last 50 successful complete discoveries, newest saved first. Does not contact
        the upstream. Failed/incomplete discovery creates no report. Observations compare with
        current registered definitions (including drafts and retired tools), not a prior remote
        catalog. Reports are historical evidence, not health or execution authorization.
      x-required-roles: [admin]
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - name: before
          in: query
          schema: {type: string, pattern: '^[0-9]+$'}
          description: Exclusive report ID, within signed int64. Zero starts the first page. Unknown, repeated or empty parameters are invalid.
      responses:
        '200':
          description: Bounded retained report page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items: {$ref: '#/components/schemas/MCPCatalogReview'}
                  next_cursor: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/mcp/servers/{id}/import:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: importMCPServerTool
      tags: [MCP Servers]
      summary: Import a reviewed remote tool as a disabled draft
      description: |
        Requires admin and an enabled server. Repeats live discovery and verifies
        the supplied tool name and schema hash before persisting its contract,
        explicit risk and response policy. New imports have status draft, enabled
        false and version 1; publish using the existing tool publication endpoint.
        The upstream read_only_hint never grants execution or bypasses approval.

        Repeating the same server/tool import with the same schema hash, risk and
        normalized response policy returns its existing tool without changing its
        publication state. A changed or missing upstream contract, different import
        configuration, or alias collision returns 409. Existing tools, prepared
        operations and approvals are never overwritten by discovery or import.
        Tool execution independently rechecks the live upstream contract.
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportInput'
      responses:
        '200':
          $ref: '#/components/responses/Tool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/tools:
    get:
      operationId: listTools
      tags: [Tools]
      summary: List visible tools
      description: |
        Admins can see draft, published and disabled tools in their workspace. All
        other roles can see only published, effectively enabled tools. Imported MCP
        tools additionally require an enabled upstream server. PostgreSQL applies the
        name/description search before paging by created_at descending then ID
        descending. The default page size is 50. Current visibility is checked on
        every page; this is not an immutable cross-request snapshot.
      x-required-roles: [admin, operator, approver, viewer]
      parameters:
        - $ref: '#/components/parameters/ToolQuery'
        - $ref: '#/components/parameters/ToolLimit'
        - $ref: '#/components/parameters/ToolCursor'
      responses:
        '200':
          description: A registry page of at most 50 visible matching tools
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createTool
      tags: [Tools]
      summary: Register a disabled draft tool
      description: |
        Requires admin. The name is unique within the authenticated workspace. The
        HTTP origin must be explicitly allowed by server egress configuration, and
        any credential reference must be bound to that workspace and exact origin.
        The tool is created with status draft, enabled false and version 1. Publishing
        is a separate action. This endpoint accepts HTTP tools only; import remote MCP
        tools using /api/v1/mcp/servers/{id}/import. Only the response policy of imported MCP tools can currently be revised;
        general definition updates and deletion remain unavailable.
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolInput'
      responses:
        '200':
          $ref: '#/components/responses/Tool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/catalog/tools:
    get:
      operationId: discoverTools
      tags: [Tools]
      summary: Search published tool summaries on demand
      description: |
        Every role, including administrators, sees only enabled, published tools
        in its authenticated workspace whose MCP server, if any, is also enabled. The default page size is 25. Results
        deliberately exclude schemas, downstream URLs and credential references.
        Fetch a selected tool by ID to read its contract. Follow next_cursor with
        the same query and identity to request another page; do not prefetch the
        complete catalog into a model context. Unknown or repeated query parameters
        are rejected. SQL wildcard characters are treated literally.
      x-required-roles: [admin, operator, approver, viewer]
      parameters:
        - $ref: '#/components/parameters/ToolQuery'
        - $ref: '#/components/parameters/ToolLimit'
        - $ref: '#/components/parameters/ToolCursor'
      responses:
        '200':
          description: A bounded page of authorized summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolDiscoveryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/tools/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getTool
      tags: [Tools]
      summary: Read a visible tool definition
      description: |
        Admins can read every tool in their workspace. Other roles can read only
        published, enabled tools. Missing, invisible and cross-workspace tools return
        404. The response includes the configured HTTP target and credential reference,
        but not credential values. MCP tools instead include the pinned server ID,
        remote tool name, contract hash and response policy; the serialized http
        field is an empty placeholder for these tools. Machine clients additionally
        require tools:read and a current tool or server grant.
      x-required-roles: [admin, operator, approver, viewer]
      responses:
        '200':
          $ref: '#/components/responses/Tool'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/tools/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: publishTool
      tags: [Tools]
      summary: Publish and enable a draft tool
      description: |
        Requires admin in the tool's workspace. Atomically changes a draft to
        published and enabled and records an audit event. Publishing an already
        published tool returns its existing state and does not re-enable it if it
        has been disabled. Tool content and version remain unchanged. Imported MCP
        tools require their upstream server to be enabled, including repeat requests.
        Retired tools return 409; restoration requires a newly reviewed candidate.
      x-required-roles: [admin]
      requestBody:
        $ref: '#/components/requestBodies/EmptyAction'
      responses:
        '200':
          $ref: '#/components/responses/Tool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/tools/{id}/enabled:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: setToolEnabled
      tags: [Tools]
      summary: Enable or disable a published tool
      description: |
        Requires admin in the tool's workspace. Draft and retired tools return 409. Repeating
        the current enabled value is idempotent. Disabling blocks new preparations
        and dispatch admission. It does not cancel a request already admitted or
        alter a recorded downstream result.
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/Tool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/tools/{id}/response-policy:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: updateToolResponsePolicy
      tags: [Tools]
      summary: Revise the response policy of an imported MCP tool
      description: |
        Requires admin in the tool workspace. Only MCP tools are supported. Locks
        the tool and compares expected_version before applying a normalized policy.
        A stale version returns 409, including for otherwise identical policies.
        A real change increments the version and records old/new policies and
        versions in the audit log; an identical current policy is a no-op. Existing
        operation snapshots retain their policy. Publication, risk, schemas, MCP
        binding and enabled flags do not change. Disabled tools and upstreams
        may have their policy repaired without becoming enabled.
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsePolicyUpdateInput'
      responses:
        '200':
          $ref: '#/components/responses/Tool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/tools/{id}/response-policy/preview:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: previewToolResponsePolicy
      tags: [Tools]
      summary: Preview a response policy against supplied sample data
      description: |
        Requires admin in the tool workspace. Reads the current MCP contract and
        validates the supplied successful MCP envelope, including the original
        structuredContent against output_schema. Performs no upstream calls or
        database writes, and does not persist the sample. expected_version must
        match the current tool version or the request returns 409. The complete
        request body is limited to 262144 bytes.
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsePolicyPreviewInput'
      responses:
        '200':
          description: Projected sample and normalized envelope byte sizes; no state was changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsePolicyPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/operations:
    get:
      operationId: listOperations
      tags:
      - Operations
      summary: Search visible operations
      description: 'Admins and approvers see workspace operations; operators and viewers see only their own. Machine
        clients additionally require current client/key validity and live tool/server grants. Keyset order is immutable
        created_at DESC, id DESC. The first request supplies a creation-time upper bound retained in later cursors.
        total counts current authorized matches inside that boundary before the position cursor; live status and permissions
        can change it. Pages are not a frozen database snapshot. Unknown/repeated query fields are rejected. '
      x-required-roles:
      - admin
      - operator
      - approver
      - viewer
      parameters:
      - $ref: '#/components/parameters/HistoryLimit'
      - $ref: '#/components/parameters/HistoryCursor'
      - $ref: '#/components/parameters/HistoryActor'
      - $ref: '#/components/parameters/HistoryFrom'
      - $ref: '#/components/parameters/HistoryTo'
      - name: state
        in: query
        required: false
        description: Exact current state.
        schema:
          $ref: '#/components/schemas/OperationState'
      - name: tool_id
        in: query
        required: false
        description: Exact tool ID.
        schema:
          type: string
          maxLength: 128
          x-max-utf8-bytes: 128
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: prepareOperation
      tags: [Operations]
      summary: Persist an operation before dispatch
      description: |
        Requires admin or operator. The tool must be published and enabled in the
        authenticated workspace. Arguments must match its input schema. The operation
        records fixed arguments, their hash and the tool version/configuration snapshot.
        Read tools enter READY; write tools enter WAITING_APPROVAL.

        Idempotency keys are unique within a workspace. Repeating a key for the same
        actor, tool and canonical argument hash returns the existing operation,
        including after the tool is disabled. Reusing a key with a different actor,
