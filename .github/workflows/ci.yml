name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  console-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: CGO_ENABLED=0 go build -o /tmp/console-dns-fixture ./test/console-dns-fixture
      - run: docker pull nginxinc/nginx-unprivileged:1.29-alpine
      - run: python3 scripts/tests/verify_console_dns.py --console-image nginxinc/nginx-unprivileged:1.29-alpine --config deploy/nginx.conf --fixture-bin /tmp/console-dns-fixture
  release-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ci-ephemeral-password
          POSTGRES_DB: gateway_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUN_CLOUD_WORKER_INTEGRATION: "1"
      TEST_DATABASE_URL: postgres://gateway:ci-ephemeral-password@127.0.0.1:5432/gateway_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci --ignore-scripts
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: mkdir -p coverage && go test -race -coverpkg=./... -coverprofile=coverage/go.out ./...
      - run: python3 scripts/check-go-coverage.py coverage/go.out
      - run: npm run check
      - run: npm test
      - run: npm run test:coverage --workspace @mcp-gateway/console
      - run: npm run test:coverage:gateway --workspace @mcp-gateway/console
      - run: npm run test:coverage:openapi --workspace @mcp-gateway/console
      - run: npm run build
      - run: npm audit --audit-level=high
